[project]
name = "hubtracktw"
version = "1.0.0"
description = "CLI tool for inspecting GitHub repositories"
requires-python = ">= 3.10"
dependencies = [
  "typer",
  "rich",
  "httpx"
]

[project.scripts]
hubtracktw = "hubtracktw.cli:app"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
